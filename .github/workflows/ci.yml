name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: agent_relay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_relay"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e 03-deployment-homework/agent-relay[dev]

      - name: Wait for Postgres
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          for i in {1..30}; do pg_isready -h localhost -p 5432 -U postgres && break || sleep 1; done
        env:
          PGPASSWORD: postgres

      - name: Run tests (unit + integration)
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agent_relay
        run: |
          cd 03-deployment-homework/agent-relay
          pytest -q

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image
        uses: docker/build-push-action@v4
        with:
          context: 03-deployment-homework/agent-relay
          push: false
          tags: agent-relay:local

      - name: Set up kind (local Kubernetes cluster)
        uses: engineerd/setup-kind@v0.6.0

      - name: Load image into kind
        run: |
          kind load docker-image agent-relay:local

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'

      - name: Deploy manifests to kind
        run: |
          kubectl apply -f 03-deployment-homework/agent-relay/k8s
          kubectl rollout status deployment/agent-relay --timeout=120s || true
