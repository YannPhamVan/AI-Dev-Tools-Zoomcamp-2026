version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: agent-relay-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agent_relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  agent-relay:
    build: .
    image: agent-relay:local
    container_name: agent-relay-service
    depends_on:
      - postgres
    environment:
      - RELAY_DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/agent_relay
      - RELAY_LEASE_SECONDS=60
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

volumes:
  pgdata: {}
